notes = 'Restructured all three prompts to front-load the response format and signal definitions so the agent knows its output constraints immediately. In the fix prompt, moved the test command above the diff context for faster reference, added a "converge fast" strategy section with explicit guidance to say RUN_TESTS immediately when confident rather than over-investigating, and lowered fix temperature from 0.2 to 0.15 to reduce exploratory wandering. These changes target the main bottleneck: reducing iteration count by helping the agent act more decisively.'
