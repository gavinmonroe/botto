# =============================================================================
# Botto configuration — all fields are optional.
# Environment variables override file values:
#   BOTTO_API_KEY, BOTTO_GITLAB_TOKEN, BOTTO_GITLAB_URL,
#   BOTTO_AI_KEY, BOTTO_AI_URL, BOTTO_WEBHOOK_SECRET
# =============================================================================

[server]
host = "0.0.0.0"
port = 7700
# max_concurrent_reviews = 3   # max MR reviews running simultaneously
# max_concurrent_ai_calls = 6  # max concurrent AI API calls across all reviews

[auth]
# Shared secret that Otto extensions use to authenticate.
# Generate with: openssl rand -hex 32
api_key = ""

[gitlab]
url = "https://gitlab.com"
# Bot account PAT — needs read_api + write_repository (for sandbox push).
bot_token = ""
# Webhook secret — must match the token configured in GitLab webhook settings.
# webhook_secret = ""

[ai]
# OpenAI-compatible endpoint (e.g., OpenRouter, local vLLM, Anthropic proxy).
base_url = ""
api_key = ""

# Per-task model overrides. Defaults shown below.
# [ai.models]
# summary = "claude-sonnet-4-5"
# code_review = "claude-sonnet-4-5"
# edge_cases = "claude-sonnet-4-5"
# related_files = "claude-haiku-4-5"
# follow_up = "claude-sonnet-4-5"
# chat = "claude-sonnet-4-5"
# ac_validation = "claude-sonnet-4-5"
# adversarial_tests = "claude-sonnet-4-5"
# contracts = "claude-sonnet-4-5"
# behavioral_delta = "claude-sonnet-4-5"
# semantic_conflict = "claude-sonnet-4-5"
# cluster_summary = "claude-sonnet-4-5"
# cluster_review_order = "claude-haiku-4-5"

[sandbox]
# Auto-detected from Docker availability. Override to force on/off.
# enabled = true
# max_concurrent = 2        # auto-detected from CPU cores
# timeout_seconds = 300
# max_memory_mb = 2048      # auto-detected from system memory
# max_disk_mb = 4096
# fix_branch_mode = "same_branch"  # "same_branch" (push to MR branch) or "new_branch" (create botto/fix/... branch + MR)
# warm_containers = true           # reuse containers across fixes on the same MR
# warm_idle_timeout_secs = 600     # kill warm containers after 10 min idle
# warm_max_lifetime_secs = 3600    # kill warm containers after 1 hour regardless
# live_output = true               # stream container stdout/stderr to Otto in real-time
# output_redaction = true          # redact secrets from live output before streaming

[cache]
# review_ttl_days = 7
# max_cached_reviews = 500  # per project

[review]
# Automatically enqueue a review when new commits land on an open MR.
# Draft MRs are skipped. By the time a human opens the MR, the AI review
# is already cached and waiting.
# auto_review_on_push = false

[cluster]
# Cross-MR cluster detection — groups related MRs by shared Jira ticket
# or file overlap. Requires the file index to be populated (via webhooks
# or on-demand when a user opens an MR page).
# enabled = true
# max_cluster_size = 8               # max MRs per cluster (2–20)
# file_overlap_threshold = 0.15      # Jaccard similarity threshold (0.05–0.80)
# summary_ttl_days = 7               # how long cluster entries are cached

[conflict]
# Conflict Radar — detects overlapping changes across in-flight MRs.
# Like clusters, requires the file index. Populated automatically from
# webhooks or on-demand when a user opens an MR.
# enabled = true
# semantic_analysis = false           # AI-powered semantic conflict analysis (expensive)
# semantic_cache_ttl_days = 3         # how long semantic analysis results are cached

[harness]
# Self-evolving prompt engineering harness. Disabled by default.
# enabled = false
# max_rounds = 10             # evolution rounds per run
# variants_per_round = 4      # prompt variants tested per round
# concurrency = 3             # parallel sandbox instances
# test_cases = 5              # test cases per variant
# gitlab_seed_orgs = ["gitlab-org"]
# memory_dir = "harness"      # directory for prompts, learnings, test cases
# judge_model = "claude-opus-4-6"

[workflow]
# Automated multi-step workflows triggered by events. Disabled by default.
# enabled = false
# max_concurrent_runs = 3        # max parallel workflow executions
# default_step_timeout_secs = 300  # timeout per workflow step

[mentor]
# Cross-repo learning system. Learns patterns from linked repositories
# to improve review quality over time. Disabled by default.
# enabled = false
# prune_below_confidence = 0.1   # remove patterns below this confidence
# prune_interval_secs = 86400    # how often to prune (default: daily)
# linked_repos = []              # list of linked repo sets for cross-learning
# Example linked repos for microservices:
# linked_repos = [
#     { name = "payments", repos = ["service-auth", "service-users", "service-billing"] },
# ]

[channels]
# Channel adapter layer — enables @botto commands in GitLab comments and
# Slack messages. Disabled by default. Requires [workflow] to be enabled
# for autonomous features (fix, directives).
# enabled = false

# [channels.gitlab]
# enabled = true                     # respond to @botto in GitLab comments
# allowed_users = []                 # empty = all users with project access
# blocked_users = []                 # block specific users (e.g., other bots)
# rate_limit_per_minute = 20         # max commands per user per minute

# [channels.slack]
# enabled = false                    # Slack integration (requires bot setup)
# bot_token_env = "BOTTO_SLACK_BOT_TOKEN"       # env var name for bot token
# signing_secret_env = "BOTTO_SLACK_SIGNING_SECRET"  # env var name for signing secret
# allowed_channels = []              # empty = all channels bot is invited to
# rate_limit_per_minute = 20

# [channels.output]
# gitlab_comments = true             # post results as GitLab comments
# slack_messages = true              # post results as Slack messages
